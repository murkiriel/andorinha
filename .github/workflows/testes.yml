# Testes do gerador a cada push e pull request. Só os testes: nada de gerar tiles nem publicar aqui (isso é o
# workflow gerar, que prepara a máquina para o build do Brasil). Sem o pyvalhalla e sem os dados baixados, os testes
# que dependem deles são pulados com o motivo no log. Actions fixadas pelo SHA do commit, com a tag em comentário, e
# dependências do gerador/requirements-testes.txt, travado com hashes.
name: testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gerador
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # As do gerador sem o pyvalhalla, nas mesmas versões, travadas com hashes (gerador/requirements-testes.in).
      - name: Dependências dos testes
        run: pip install --require-hashes -r requirements-testes.txt
      - name: Testes
        run: python -m unittest discover -s tests -t . -v
